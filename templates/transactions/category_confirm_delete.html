{% extends 'base.html' %}
{% block title %}Delete Category{% endblock %}
{% block content %}
<div class="max-w-md bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
    <h1 class="text-xl font-semibold mb-4">Delete "{{ object.name }}"?</h1>
    <p class="text-sm text-gray-500 mb-6">Subcategories and linked rules under this category will be affected. This is a soft delete.</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex gap-3">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-700">Delete</button>
            <a href="{% url 'category-list' %}" class="px-4 py-2 rounded-lg text-sm border border-gray-300 dark:border-gray-600">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

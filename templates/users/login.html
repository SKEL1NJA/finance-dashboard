{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white dark:bg-gray-800 p-8 rounded-xl shadow">
    <h1 class="text-2xl font-semibold mb-6">Log in</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Log in</button>
    </form>
    <p class="text-sm mt-4 text-gray-500">No account? <a href="{% url 'signup' %}" class="text-indigo-600">Sign up</a></p>
</div>
{% endblock %}
